# Optional system-tag overrides for custom emulator paks.
# Format: TAG=exact retro_system_info.library_name folder
#
# Installed paks are detected from EMU_EXE= and mapped to the exact libretro
# library-name spelling for every core shipped in NextUI Base and Extras, plus
# the pak-store cores whose names have been verified. These tag overrides take
# precedence over that built-in mapping; they are not a duplicate copy of it.
#
# An unrecognized EMU_EXE value is NOT guessed at. The tag is left unmapped, its
# saves stay in /Saves/<TAG>, and the conversion report asks you to add an
# override here. Guessing would create a folder the emulator never writes to,
# silently splitting your saves across two locations.
#
# The value must be the core's retro_system_info.library_name, which is not
# always the name RetroArch displays -- FreeIntv, for example, reports
# "freeintv". On device you can read the real value out of the core with:
#
#   strings /path/to/<core>_libretro.so | grep -i <core>
#
# Standalone (non-libretro) emulator paks manage their own saves and should be
# left unmapped.
#
# Examples:
# GBA=gpSP
# SFC=Snes9x
