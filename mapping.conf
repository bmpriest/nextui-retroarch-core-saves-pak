# Optional system-tag overrides for custom emulator paks.
# Format: TAG=exact retro_system_info.library_name folder
#
# Installed paks are detected from EMU_EXE= and mapped to the official
# libretro library-name spelling where known. Unknown EMU_EXE values are used
# as-is. These tag overrides take precedence over that built-in executable-name
# mapping; they are not a duplicate copy of it.
#
# Examples:
# GBA=gpSP
# SFC=Snes9x
